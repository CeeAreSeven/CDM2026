<style>

    --gold: #f5b642; --gold2: #ffd97d; --green: #34d399;
    --blue: #60a5fa; --red: #f87171; --gray: #9ca3af;
    --white: #f1f5f9; --muted: #6b7280;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--white); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  .header { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); padding: 20px; text-align: center; border-bottom: 1px solid var(--border2); }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
  .header p { color: var(--gray); font-size: 12px; margin-top: 4px; }
  .rules { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .rule { background: rgba(245,182,66,0.12); border: 1px solid rgba(245,182,66,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--gold2); }

  /* Sélecteur joueur */
  .player-selector { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .player-selector label { font-size: 12px; color: var(--gray); flex-shrink: 0; }
  .player-selector select { background: var(--bg3); border: 1px solid var(--border2); color: var(--white); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; flex: 1; min-width: 140px; }
  .player-selector select:focus { outline: none; border-color: var(--gold); }
  .sync-status { margin-left: auto; font-size: 11px; display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  .sync-dot.offline { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Nav */
  .nav { display: flex; overflow-x: auto; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { flex-shrink: 0; padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--gray); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
  .nav-btn:hover { color: var(--white); }
  .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* Scoreboard */
  .scoreboard { padding: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .score-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .score-card.me { border-color: rgba(245,182,66,0.4); background: rgba(245,182,66,0.06); }
  .score-card .srank { font-size: 18px; font-weight: 700; color: var(--gold); }
  .score-card .sname { font-size: 13px; font-weight: 600; margin: 2px 0; }
  .score-card .spts span { color: var(--green); font-weight: 700; font-size: 15px; }
  .score-card .spts { font-size: 11px; color: var(--gray); }
  .score-card .sdetail { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .section { padding: 0 14px 14px; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 0 6px; border-top: 1px solid var(--border); margin-top: 6px; }
  .group-header { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; flex-wrap: wrap; }
  .group-badge { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--blue); }
  .phase-title { background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.2); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--blue); margin: 12px 0 8px; }

  /* Match card */
  .match { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .match-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px 4px; }
  .match-date { font-size: 10px; color: var(--muted); }
  .match-id { font-size: 10px; color: var(--blue); }
  .teams { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px; }
  .team { flex: 1; }
  .team.home { text-align: right; }
  .team-name { font-size: 13px; font-weight: 600; }
  .vs { color: var(--muted); font-size: 11px; flex-shrink: 0; }

  /* Mon pronostic (joueur courant) */
  .my-prono { padding: 6px 12px 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .my-prono-label { font-size: 11px; color: var(--gold); font-weight: 600; flex-shrink: 0; }
  .score-inputs { display: flex; align-items: center; gap: 4px; }
  .score-inputs input { width: 30px; height: 28px; background: rgba(245,182,66,0.1); border: 1px solid rgba(245,182,66,0.35); border-radius: 6px; color: var(--gold2); text-align: center; font-size: 14px; font-weight: 700; padding: 0; -moz-appearance: textfield; }
  .score-inputs input::-webkit-outer-spin-button, .score-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-inputs input:focus { outline: none; border-color: var(--gold); }
  .score-inputs span { color: var(--gold); font-weight: 700; }

  /* Résultat réel (admin = Mathieu) */
  .result-row { padding: 5px 12px 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .result-label { font-size: 11px; color: var(--green); font-weight: 600; flex-shrink: 0; }
  .result-inputs { display: flex; align-items: center; gap: 4px; }
  .result-inputs input { width: 30px; height: 26px; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.35); border-radius: 6px; color: var(--green); text-align: center; font-size: 13px; font-weight: 700; padding: 0; -moz-appearance: textfield; }
  .result-inputs input::-webkit-outer-spin-button, .result-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .result-inputs input:focus { outline: none; border-color: var(--green); }
  .result-inputs span { color: var(--green); font-weight: 700; }
  .admin-badge { font-size: 10px; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--green); border-radius: 10px; padding: 2px 7px; }

  /* All pronostics grid */
  .all-pronostics { border-top: 1px solid var(--border); padding: 6px 12px 8px; }
  .all-pronostics-title { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .all-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .player-cell { background: var(--bg2); border-radius: 6px; padding: 4px 6px; text-align: center; }
  .player-cell .pcname { font-size: 10px; color: var(--muted); }
  .player-cell .pcprono { font-size: 12px; font-weight: 700; }
  .player-cell.exact { background: rgba(245,182,66,0.15); border: 1px solid rgba(245,182,66,0.3); }
  .player-cell.exact .pcprono { color: var(--gold2); }
  .player-cell.good { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); }
  .player-cell.good .pcprono { color: var(--green); }
  .player-cell.zero { background: rgba(248,113,113,0.08); }
  .player-cell.zero .pcprono { color: var(--red); }
  .player-cell.pending .pcprono { color: var(--muted); }

  /* Ranking table */
  .ranking-table { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .ranking-table table { width: 100%; border-collapse: collapse; }
  .ranking-table th { background: rgba(96,165,250,0.1); padding: 8px 10px; text-align: left; font-size: 10px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .ranking-table td { padding: 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .rank-num { font-weight: 700; color: var(--gold); }
  .rank-pts { font-weight: 700; color: var(--green); }

  .page { display: none; }
  .page.active { display: block; padding-bottom: 80px; }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .save-indicator { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(52,211,153,0.9); color: #0a0e1a; border-radius: 20px; padding: 6px 16px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.3s; z-index: 300; pointer-events: none; }
  .save-indicator.show { opacity: 1; }
</style>
</head>

const dbRef = ref(db, 'matches');
onValue(dbRef, (snapshot) => {
  dbState = snapshot.val() || {};
  document.getElementById('syncDot').classList.remove('offline');
  document.getElementById('syncLabel').textContent = 'En ligne';
  refreshAll();
}, (error) => {
  document.getElementById('syncDot').classList.add('offline');
  document.getElementById('syncLabel').textContent = 'Hors ligne';
});

function getMatch(id) { return dbState[id] || { result: {}, pronostics: {} }; }

function calcPoints(ph, pa, rh, ra) {
  if (ph===''||pa===''||rh===''||ra===''||ph==null||pa==null||rh==null||ra==null) return null;
  ph=parseInt(ph); pa=parseInt(pa); rh=parseInt(rh); ra=parseInt(ra);
  if ([ph,pa,rh,ra].some(isNaN)) return null;
  if (ph===rh && pa===ra) return 3;
  const pr = ph>pa?'H':ph<pa?'A':'N', rr = rh>ra?'H':rh<ra?'A':'N';
  return pr===rr ? 1 : 0;
}

function showSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

async function saveProno(matchId, player, h, a) {
  const updates = {};
  updates[`matches/${matchId}/pronostics/${encodePlayer(player)}/h`] = h;
  updates[`matches/${matchId}/pronostics/${encodePlayer(player)}/a`] = a;
  await update(ref(db), updates);
  showSaved();
}

async function saveResult(matchId, h, a) {
  const updates = {};
  updates[`matches/${matchId}/result/h`] = h;
  updates[`matches/${matchId}/result/a`] = a;
  await update(ref(db), updates);
  showSaved();
}

function encodePlayer(p) { return p.replace(/[^a-zA-Z0-9]/g, '_'); }
function decodeKey(k) { return PLAYERS.find(p => encodePlayer(p) === k) || k; }

function getProno(matchId, player) {
  const m = getMatch(matchId);
  const key = encodePlayer(player);
  return (m.pronostics && m.pronostics[key]) || {h:'', a:''};
}

function getResult(matchId) {
  return getMatch(matchId).result || {};
}

// Rendu match
function renderMatch(match) {
  const div = document.createElement('div');
  div.className = 'match';
  div.id = `match-${match.id}`;
  updateMatchContent(div, match);
  return div;
}

function updateMatchContent(div, match) {
  const cp = currentPlayer;
  const r = getResult(match.id);
  const myProno = cp ? getProno(match.id, cp) : {h:'',a:''};
  const isAdmin = true;

  let allPronosHTML = '<div class="all-pronostics"><div class="all-pronostics-title">Pronostics du groupe</div><div class="all-grid">';
  PLAYERS.forEach(p => {
    const pr = getProno(match.id, p);
    const pt = calcPoints(pr.h, pr.a, r.h, r.a);
    const cls = pt===null ? 'pending' : pt===3 ? 'exact' : pt===1 ? 'good' : 'zero';
    const pronoStr = (pr.h!==''&&pr.h!=null&&pr.a!==''&&pr.a!=null) ? `${pr.h} - ${pr.a}` : '—';
    allPronosHTML += `<div class="player-cell ${cls}"><div class="pcname">${p}</div><div class="pcprono">${pronoStr}</div></div>`;
  });
  allPronosHTML += '</div></div>';

  div.innerHTML = `
    <div class="match-header">
      <span class="match-date">${match.date}</span>
      <span class="match-id">${match.id}</span>
    </div>
    <div class="teams">
      <div class="team home"><span class="team-name">${match.home}</span></div>
      <div class="vs">vs</div>
      <div class="team away"><span class="team-name">${match.away}</span></div>
    </div>
    ${cp ? `<div class="my-prono">
      <span class="my-prono-label">Mon prono :</span>
      <div class="score-inputs">
        <input type="number" min="0" max="20" value="${myProno.h??''}" placeholder="—"
          onchange="window._saveProno('${match.id}','h',this.value)" />
        <span>—</span>
        <input type="number" min="0" max="20" value="${myProno.a??''}" placeholder="—"
          onchange="window._saveProno('${match.id}','a',this.value)" />
      </div>
    </div>` : '<div style="padding:6px 12px;font-size:11px;color:var(--muted)">Sélectionne ton nom pour saisir ton pronostic</div>'}
    ${isAdmin ? `<div class="result-row">
      <span class="result-label">Score réel :</span>
      <div class="result-inputs">
        <input type="number" min="0" max="20" value="${r.h??''}" placeholder="—"
          onchange="window._saveResult('${match.id}','h',this.value)" oninput="window._saveResult('${match.id}','h',this.value)" />
        <span>—</span>
        <input type="number" min="0" max="20" value="${r.a??''}" placeholder="—"
          onchange="window._saveResult('${match.id}','a',this.value)" oninput="window._saveResult('${match.id}','a',this.value)" />
      </div>
      <span class="admin-badge">Admin</span>
    </div>` : (r.h!=null&&r.h!=='' ? `<div style="padding:5px 12px 8px;border-top:1px solid var(--border);font-size:12px;color:var(--green)">Résultat : <strong>${r.h} — ${r.a}</strong></div>` : '')}
    ${allPronosHTML}
  `;

  // Attach current match ref for dynamic updates
  div.dataset.matchId = match.id;
}

// Global handlers for inline onchange
window._saveProno = function(matchId, side, val) {
  if (!currentPlayer) { alert('Sélectionne ton nom en haut !'); return; }
  const cur = getProno(matchId, currentPlayer);
  const h = side==='h' ? val : cur.h;
  const a = side==='a' ? val : cur.a;
  saveProno(matchId, currentPlayer, h===''?'':parseInt(h), a===''?'':parseInt(a));
};

window._saveResult = function(matchId, side, val) {
  const r = getResult(matchId);
  const h = side==='h' ? val : r.h;
  const a = side==='a' ? val : r.a;
  saveResult(matchId, h===''?'':parseInt(h), a===''?'':parseInt(a));
};

function getAllMatches() {
  const all = [];
  Object.values(GROUPS).forEach(g => g.matches.forEach(m => all.push(m)));
  FINALE_ROUNDS.forEach(r => r.matches.forEach(m => all.push(m)));
  return all;
}

function getPlayerStats() {
  const all = getAllMatches();
  return PLAYERS.map(p => {
    let pts=0,exact=0,good=0,played=0;
    all.forEach(m => {
      const pr = getProno(m.id, p);
      const r = getResult(m.id);
      const pt = calcPoints(pr.h, pr.a, r.h, r.a);
      if (pt!==null) { played++; pts+=pt; if(pt===3)exact++; if(pt===1)good++; }
    });
    return {name:p,pts,exact,good,played};
  }).sort((a,b) => b.pts-a.pts || b.exact-a.exact);
}

function refreshScoreboard() {
  const stats = getPlayerStats();
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('scoreboard').innerHTML = stats.map((s,i) => `
    <div class="score-card ${s.name===currentPlayer?'me':''}">
      <div class="srank">${medals[i]||i+1}</div>
      <div class="sname">${s.name}</div>
      <div class="spts">Points : <span>${s.pts}</span></div>
      <div class="sdetail">⭐${s.exact} exacts · ✅${s.good} bons · ${s.played} joués</div>
    </div>`).join('');
  document.getElementById('ranking-body').innerHTML = stats.map((s,i) => `
    <tr>
      <td class="rank-num">${medals[i]||i+1}</td>
      <td>${s.name===currentPlayer?`<strong>${s.name} 👤</strong>`:s.name}</td>
      <td class="rank-pts">${s.pts}</td>
      <td style="color:var(--gold2)">⭐ ${s.exact}</td>
      <td style="color:var(--green)">✅ ${s.good}</td>
      <td style="color:var(--muted)">${s.played}</td>
    </tr>`).join('');
}

function refreshAll() {
  refreshScoreboard();
  // Update all rendered match cards
  document.querySelectorAll('.match[data-match-id]').forEach(div => {
    const matchId = div.dataset.matchId;
    const allMatches = getAllMatches();
    const match = allMatches.find(m => m.id === matchId);
    if (match) updateMatchContent(div, match);
  });
}

function buildGroupPage(key) {
  const g = GROUPS[key];
  const container = document.getElementById(`groupe${key}`);
  if (container.dataset.built) return;
  container.dataset.built = '1';
  const section = document.createElement('div');
  section.className = 'section';
  const gh = document.createElement('div');
  gh.className = 'group-header';
  gh.innerHTML = `<span class="group-badge">GROUPE ${key}</span><span style="color:var(--muted);font-size:12px;">${g.teams.join(' · ')}</span>`;
  section.appendChild(gh);
  const journees = [
    {label:'1re journée', matches: g.matches.slice(0,2)},
    {label:'2e journée', matches: g.matches.slice(2,4)},
    {label:'3e journée', matches: g.matches.slice(4,6)},
  ];
  journees.forEach(j => {
    const lbl = document.createElement('div');
    lbl.className = 'section-title';
    lbl.textContent = j.label;
    section.appendChild(lbl);
    j.matches.forEach(m => section.appendChild(renderMatch(m)));
  });
  container.appendChild(section);
}

function buildFinalePage() {
  const container = document.getElementById('finale');
  if (container.dataset.built) return;
  container.dataset.built = '1';
  const section = document.createElement('div');
  section.className = 'section';
  FINALE_ROUNDS.forEach(round => {
    const pt = document.createElement('div');
    pt.className = 'phase-title';
    pt.textContent = round.phase;
    section.appendChild(pt);
    round.matches.forEach(m => section.appendChild(renderMatch(m)));
  });
  container.appendChild(section);
}

window.showPage = function(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    const pages = ['classement','groupeA','groupeB','groupeC','groupeD','groupeE','groupeF','groupeG','groupeH','groupeI','groupeJ','groupeK','groupeL','finale'];
    b.classList.toggle('active', pages[i]===pageId);
  });
  if (pageId.startsWith('groupe')) buildGroupPage(pageId.replace('groupe',''));
  if (pageId==='finale') buildFinalePage();
  if (pageId==='classement') refreshScoreboard();
};

window.onPlayerChange = function() {
  currentPlayer = document.getElementById('currentPlayer').value;
  localStorage.setItem('cdm_player', currentPlayer);
  refreshAll();
  // Rebuild all built pages with new player context
  Object.keys(GROUPS).forEach(k => {
    const c = document.getElementById(`groupe${k}`);
    if (c.dataset.built) { c.innerHTML=''; delete c.dataset.built; buildGroupPage(k); }
  });
  const fc = document.getElementById('finale');
  if (fc.dataset.built) { fc.innerHTML=''; delete fc.dataset.built; buildFinalePage(); }
};

// Restore player
if (currentPlayer) {
  document.getElementById('currentPlayer').value = currentPlayer;
}
</script>
</body>
</html>
