:root {
  --bg: #0a0e1a; --bg2: #111827; --bg3: #1a2235;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--white); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

.header h1 { font-size: 20px; font-weight: 700; color: var(--gold); }
.header p { color: var(--gray); font-size: 12px; margin-top: 4px; }
.rules { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.rule { background: rgba(245,182,66,0.12); border: 1px solid rgba(245,182,66,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--gold2); }
.player-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.player-bar label { font-size: 12px; color: var(--gray); }
.player-bar select { background: var(--bg3); border: 1px solid var(--border2); color: var(--white); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; flex: 1; min-width: 140px; }
.sync { margin-left: auto; font-size: 11px; display: flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.dot.off { background: var(--red); }
.nav { display: flex; overflow-x: auto; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.nav::-webkit-scrollbar { display: none; }
.nav button { flex-shrink: 0; padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--gray); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav button.active { color: var(--gold); border-bottom-color: var(--gold); }
.page { display: none; padding-bottom: 60px; }
.page.active { display: block; }
.section { padding: 0 14px 14px; }
.sec-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 10px 0 6px; border-top: 1px solid var(--border); margin-top: 6px; }
.grp-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; flex-wrap: wrap; }
.grp-badge { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--blue); }
.phase-title { background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.2); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--blue); margin: 12px 0 8px; }
.match { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.match-hdr { display: flex; justify-content: space-between; padding: 7px 12px 4px; }
.match-hdr span { font-size: 10px; color: var(--muted); }
.match-hdr .mid { color: var(--blue); }
.teams { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px; }
.team { flex: 1; font-size: 13px; font-weight: 600; }
.team.home { text-align: right; }
.vs { color: var(--muted); font-size: 11px; flex-shrink: 0; }
.prono-row { padding: 6px 12px 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.prono-label { font-size: 11px; font-weight: 600; flex-shrink: 0; }
.prono-label.my { color: var(--gold); }
.prono-label.real { color: var(--green); }
.inputs { display: flex; align-items: center; gap: 4px; }
.inputs input { width: 32px; height: 28px; text-align: center; font-size: 14px; font-weight: 700; padding: 0; border-radius: 6px; -moz-appearance: textfield; }
.inputs input::-webkit-outer-spin-button, .inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
.inputs input:focus { outline: none; }
.inputs .sep { font-weight: 700; }
input.gold { background: rgba(245,182,66,0.1); border: 1px solid rgba(245,182,66,0.35); color: var(--gold2); }
input.gold:focus { border-color: var(--gold); }
.sep.gold { color: var(--gold); }
input.green { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.35); color: var(--green); }
input.green:focus { border-color: var(--green); }
.sep.green { color: var(--green); }
.all-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 6px 12px 8px; border-top: 1px solid var(--border); }
.pcell { background: var(--bg2); border-radius: 6px; padding: 4px 6px; text-align: center; border: 1px solid transparent; }
.pcell .pname { font-size: 10px; color: var(--muted); }
.pcell .pval { font-size: 12px; font-weight: 700; color: var(--white); }
.pcell.exact { background: rgba(245,182,66,0.15); border-color: rgba(245,182,66,0.3); }
.pcell.exact .pval { color: var(--gold2); }
.pcell.good { background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.2); }
.pcell.good .pval { color: var(--green); }
.pcell.zero .pval { color: var(--red); }
.pcell.pending .pval { color: var(--muted); }
.scoreboard { padding: 14px; display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 8px; }
.scard { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.scard.me { border-color: rgba(245,182,66,0.4); background: rgba(245,182,66,0.06); }
.scard .rank { font-size: 20px; }

.scard .sdetail { font-size: 10px; color: var(--muted); margin-top: 2px; }

.rank-table table { width: 100%; border-collapse: collapse; }
.rank-table th { background: rgba(96,165,250,0.1); padding: 8px 10px; text-align: left; font-size: 10px; color: var(--blue); text-transform: uppercase; }

// ========== STATE ==========
var state = {};
var currentPlayer = localStorage.getItem('cdm_player') || '';

function encP(p) { return p.replace(/[^a-zA-Z0-9]/g,'_'); }
function getResult(mid) { return (state[mid] && state[mid].result) ? state[mid].result : {}; }
function getProno(mid, p) { 
  var key = encP(p);
  return (state[mid] && state[mid].pronostics && state[mid].pronostics[key]) ? state[mid].pronostics[key] : {};
}

function calcPts(ph, pa, rh, ra) {
  if (ph==null||pa==null||rh==null||ra==null||ph===''||pa===''||rh===''||ra==='') return null;
  ph=parseInt(ph); pa=parseInt(pa); rh=parseInt(rh); ra=parseInt(ra);
  if (isNaN(ph)||isNaN(pa)||isNaN(rh)||isNaN(ra)) return null;
  if (ph===rh && pa===ra) return 3;
  var pr=ph>pa?'H':ph<pa?'A':'N', rr=rh>ra?'H':rh<ra?'A':'N';
  return pr===rr?1:0;
}

function showSaved() {
  var el = document.getElementById('saved');
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 1500);
}

// ========== FIREBASE LISTENERS ==========

  refreshAll();
}, function() {

// ========== SAVE FUNCTIONS ==========
function saveProno(mid, player, h, a) {
  if (h === '' || a === '' || isNaN(parseInt(h)) || isNaN(parseInt(a))) return;
  var key = encP(player);
  var update = {};
  update['matches/' + mid + '/pronostics/' + key + '/h'] = parseInt(h);
  update['matches/' + mid + '/pronostics/' + key + '/a'] = parseInt(a);
  db.ref().update(update, function(err) {
    if (!err) showSaved();
  });
}

function saveResult(mid, h, a) {
  if (h === '' || a === '' || isNaN(parseInt(h)) || isNaN(parseInt(a))) return;
  var update = {};
  update['matches/' + mid + '/result/h'] = parseInt(h);
  update['matches/' + mid + '/result/a'] = parseInt(a);
  db.ref().update(update, function(err) {
    if (!err) showSaved();
  });
}

// ========== RENDER ==========
function renderMatch(m) {
  var r = getResult(m.id);
  var myP = currentPlayer ? getProno(m.id, currentPlayer) : {};

  var allGrid = '<div class="all-grid">';
  PLAYERS.forEach(function(p) {
    var pr = getProno(m.id, p);
    var pt = calcPts(pr.h, pr.a, r.h, r.a);
    var cls = pt===null?'pending':pt===3?'exact':pt===1?'good':'zero';
    var val = (pr.h!=null&&pr.h!==''&&pr.a!=null&&pr.a!=='') ? pr.h+' - '+pr.a : '—';
    allGrid += '<div class="pcell '+cls+'"><div class="pname">'+p+'</div><div class="pval">'+val+'</div></div>';
  });
  allGrid += '</div>';

  var myPronoRow = currentPlayer
    ? '<div class="prono-row"><span class="prono-label my">Mon prono :</span><div class="inputs">'
      + '<input class="gold" type="number" min="0" max="20" id="ph_'+m.id+'" value="'+(myP.h!=null&&myP.h!==''?myP.h:'')+'" placeholder="—">'
      + '<span class="sep gold">—</span>'
      + '<input class="gold" type="number" min="0" max="20" id="pa_'+m.id+'" value="'+(myP.a!=null&&myP.a!==''?myP.a:'')+'" placeholder="—">'
      + '<button onclick="doSaveProno(\''+m.id+'\')" style="margin-left:8px;background:rgba(245,182,66,0.2);border:1px solid rgba(245,182,66,0.4);color:var(--gold2);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;">OK</button>'
      + '</div></div>'
    : '<div style="padding:6px 12px;font-size:11px;color:var(--muted)">Sélectionne ton nom pour pronostiquer</div>';

  var resultRow = '<div class="prono-row"><span class="prono-label real">Score réel :</span><div class="inputs">'
    + '<input class="green" type="number" min="0" max="20" id="rh_'+m.id+'" value="'+(r.h!=null&&r.h!==''?r.h:'')+'" placeholder="—">'
    + '<span class="sep green">—</span>'
    + '<input class="green" type="number" min="0" max="20" id="ra_'+m.id+'" value="'+(r.a!=null&&r.a!==''?r.a:'')+'" placeholder="—">'
    + '<button onclick="doSaveResult(\''+m.id+'\')" style="margin-left:8px;background:rgba(52,211,153,0.2);border:1px solid rgba(52,211,153,0.4);color:var(--green);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;">OK</button>'
    + '</div></div>';

  return '<div class="match" id="m_'+m.id+'">'
    + '<div class="match-hdr"><span>'+m.date+'</span><span class="mid">'+m.id+'</span></div>'
    + '<div class="teams"><div class="team home">'+m.home+'</div><div class="vs">vs</div><div class="team">'+m.away+'</div></div>'
    + myPronoRow + resultRow + allGrid
    + '</div>';
}

function doSaveProno(mid) {
  if (!currentPlayer) { alert('Sélectionne ton nom en haut !'); return; }
  var h = document.getElementById('ph_'+mid).value;
  var a = document.getElementById('pa_'+mid).value;
  saveProno(mid, currentPlayer, h, a);
}

function doSaveResult(mid) {
  var h = document.getElementById('rh_'+mid).value;
  var a = document.getElementById('ra_'+mid).value;
  saveResult(mid, h, a);
}

function buildGroupPage(key) {
  var g = GROUPS[key];
  var el = document.getElementById('page-'+key);
  if (el.dataset.built) return;
  el.dataset.built = '1';
  var html = '<div class="section"><div class="grp-hdr"><span class="grp-badge">GROUPE '+key+'</span><span style="color:var(--muted);font-size:12px;">'+g.teams.join(' · ')+'</span></div>';
  var labels = ['1re journée','2e journée','3e journée'];
  for (var j=0;j<3;j++) {
    html += '<div class="sec-title">'+labels[j]+'</div>';
    html += renderMatch(g.matches[j*2]);
    html += renderMatch(g.matches[j*2+1]);
  }
  html += '</div>';
  el.innerHTML = html;
}

function buildFinalePage() {
  var el = document.getElementById('page-finale');
  if (el.dataset.built) return;
  el.dataset.built = '1';
  var html = '<div class="section">';
  FINALE.forEach(function(r) {
    html += '<div class="phase-title">'+r.phase+'</div>';
    r.matches.forEach(function(m) { html += renderMatch(m); });
  });
  html += '</div>';
  el.innerHTML = html;
}

function getAllMatches() {
  var all = [];
  Object.values(GROUPS).forEach(function(g){ g.matches.forEach(function(m){ all.push(m); }); });
  FINALE.forEach(function(r){ r.matches.forEach(function(m){ all.push(m); }); });
  return all;
}

function getStats() {
  return PLAYERS.map(function(p) {
    var pts=0,exact=0,good=0,played=0;
    getAllMatches().forEach(function(m) {
      var pr=getProno(m.id,p), r=getResult(m.id);
      var pt=calcPts(pr.h,pr.a,r.h,r.a);
      if (pt!==null){played++;pts+=pt;if(pt===3)exact++;if(pt===1)good++;}
    });
    return {name:p,pts:pts,exact:exact,good:good,played:played};
  }).sort(function(a,b){ return b.pts-a.pts||b.exact-a.exact; });
}

function refreshScoreboard() {
  var stats = getStats();
  var medals = ['🥇','🥈','🥉'];
  document.getElementById('scoreboard').innerHTML = stats.map(function(s,i){
    return '<div class="scard'+(s.name===currentPlayer?' me':'')+'"><div class="rank">'+(medals[i]||i+1)+'</div>'
      +'<div class="sname">'+s.name+'</div>'
      +'<div class="spts">Points : <b>'+s.pts+'</b></div>'
      +'<div class="sdetail">⭐'+s.exact+' exacts · ✅'+s.good+' bons · '+s.played+' joués</div></div>';
  }).join('');
  document.getElementById('rankBody').innerHTML = stats.map(function(s,i){
    return '<tr><td>'+(medals[i]||i+1)+'</td><td>'+(s.name===currentPlayer?'<strong>'+s.name+'</strong>':s.name)+'</td>'
      +'<td style="color:var(--green);font-weight:700">'+s.pts+'</td>'
      +'<td style="color:var(--gold2)">⭐ '+s.exact+'</td>'
      +'<td style="color:var(--green)">✅ '+s.good+'</td>'
      +'<td style="color:var(--muted)">'+s.played+'</td></tr>';
  }).join('');
}

function refreshAll() {
  refreshScoreboard();
  // Rebuild open pages
  Object.keys(GROUPS).forEach(function(k){
    var el=document.getElementById('page-'+k);
    if (el && el.dataset.built) { el.innerHTML=''; delete el.dataset.built; buildGroupPage(k); }
  });
  var fel=document.getElementById('page-finale');
  if (fel && fel.dataset.built) { fel.innerHTML=''; delete fel.dataset.built; buildFinalePage(); }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  if (GROUPS[id]) buildGroupPage(id);
  if (id==='finale') buildFinalePage();
  if (id==='classement') refreshScoreboard();
}

// ========== INIT ==========
document.getElementById('playerSelect').addEventListener('change', function() {
  currentPlayer = this.value;
  localStorage.setItem('cdm_player', currentPlayer);
  refreshAll();
});

if (currentPlayer) {
  document.getElementById('playerSelect').value = currentPlayer;
}
</script>
</body>
</html>
